<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="hybridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1fb6e8" />
      <stop offset="50%" stop-color="#6f4bff" />
      <stop offset="100%" stop-color="#e9449a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e1a" />
      <stop offset="100%" stop-color="#e9449a" />
    </linearGradient>
  </defs>
  <!-- Rounded obsidian background -->
