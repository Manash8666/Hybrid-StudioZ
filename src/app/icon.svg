  <!-- Geometric Hybrid Monogram -->
  <path d="M36 34 V94" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <path d="M92 34 V94" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <path d="M36 64 H92" stroke="url(#hybridGrad)" stroke-width="12" stroke-linecap="round" />
  
