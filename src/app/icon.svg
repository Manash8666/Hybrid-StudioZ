<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Top-Left Metallic Wing Gradient -->
    <linearGradient id="hsWingTopFavicon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f9" />
      <stop offset="100%" stop-color="#b8bdc7" />
    </linearGradient>
    <!-- Bottom-Right Metallic Wing Gradient -->
    <linearGradient id="hsWingBottomFavicon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#686e7a" />
      <stop offset="100%" stop-color="#dce0e8" />
    </linearGradient>
    <!-- Ambient Sapphire Glow -->
    <radialGradient id="hsBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a3ce8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#02040a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Rounded Square Container -->
  <rect width="128" height="128" rx="26" fill="#02040a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  <circle cx="64" cy="64" r="50" fill="url(#hsBgGlow)" />

  <!-- Centered Hybrid Studioz H/S Ribbon Emblem -->
  <g transform="translate(19, 14) scale(0.82)">
    <!-- Top-Left Crescent Wing -->
    <path
      d="M46 6C24 14 8 30 4 46C12 56 20 62 28 66C32 44 40 24 46 6Z"
      fill="url(#hsWingTopFavicon)"
    />

    <!-- Bottom-Right Crescent Wing -->
    <path
      d="M58 68C62 86 58 102 52 116C72 108 86 92 90 78C82 66 70 62 58 68Z"
      fill="url(#hsWingBottomFavicon)"
    />

    <!-- Core Interlocking White 'H/S' Ribbon -->
    <path
      d="M78 10C48 16 28 38 28 58C28 74 44 76 62 74C78 72 90 80 86 98C98 84 102 62 86 50C72 40 52 44 48 32C44 22 58 14 78 10Z"
      fill="#ffffff"
    />
  </g>
</svg>
